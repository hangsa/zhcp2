<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --blue-50: #E6F1FB; --blue-100: #B5D4F4; --blue-200: #85B7EB;
      --blue-400: #378ADD; --blue-600: #185FA5;
      --text: #2C2C2A; --text-sec: #5F5E5A; --text-ter: #888780;
      --bg: #fff; --bg-sec: #F8F7F3; --bg-ter: #F1EFE8;
      --border: rgba(60,58,50,0.12); --border-med: rgba(60,58,50,0.22);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #E8E6DF; --text-sec: #B4B2A9; --text-ter: #888780;
        --bg: #1C1B18; --bg-sec: #252420; --bg-ter: #2C2B28;
        --border: rgba(210,205,190,0.1); --border-med: rgba(210,205,190,0.18);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; width: 320px; min-height: 100vh; background: var(--bg); color: var(--text); font-size: 14px; display: flex; flex-direction: column; }
    .header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .title { font-size: 16px; font-weight: 500; }
    .close-btn { width: 28px; height: 28px; border: none; background: transparent; cursor: pointer; color: var(--text-sec); font-size: 18px; border-radius: 4px; }
    .close-btn:hover { background: var(--bg-sec); }
    .content { flex: 1; overflow-y: auto; padding: 12px; }
    .empty-state { text-align: center; color: var(--text-ter); padding: 40px 0; }
    .block-item { background: var(--bg-sec); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; position: relative; }
    .block-item:hover .delete-btn { opacity: 1; }
    .block-text { font-size: 13px; line-height: 1.6; color: var(--text); white-space: pre-wrap; word-break: break-word; }
    .block-text:focus { outline: none; background: var(--bg); }
    .block-meta { font-size: 11px; color: var(--text-ter); margin-top: 6px; }
    .delete-btn { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border: none; background: var(--coral-100, #F5C4B3); color: var(--coral-800, #712B13); border-radius: 4px; cursor: pointer; opacity: 0; transition: opacity 0.2s; font-size: 12px; }
    .footer { padding: 12px 16px; border-top: 1px solid var(--border); }
    .stats { font-size: 12px; color: var(--text-ter); margin-bottom: 10px; }
    .save-btn { width: 100%; padding: 10px 16px; background: var(--blue-600); color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .save-btn:hover { background: var(--blue-400); }
    .save-btn:disabled { background: var(--text-ter); cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">已选内容</span>
    <button class="close-btn" id="closeBtn">×</button>
  </div>
  <div class="content" id="content">
    <div class="empty-state" id="emptyState">点击页面中的段落来添加内容</div>
  </div>
  <div class="footer">
    <div class="stats" id="stats">已选 0 段，约 0 字</div>
    <button class="save-btn" id="saveBtn" disabled>保存 TXT</button>
  </div>
  <script src="sidebar.js"></script>
</body>
</html>
