<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --blue-50: #E6F1FB; --blue-100: #B5D4F4; --blue-400: #378ADD; --blue-600: #185FA5;
      --text: #2C2C2A; --text-sec: #5F5E5A; --text-ter: #888780;
      --bg: #fff; --bg-sec: #F8F7F3; --bg-ter: #F1EFE8;
      --border: rgba(60,58,50,0.12); --border-med: rgba(60,58,50,0.22);
      --green-50: #EAF3DE; --green-100: #C0DD97;
      --coral-50: #FAECE7; --coral-100: #F5C4B3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; background: var(--bg); color: var(--text); font-size: 14px; }
    h1 { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
    .subtitle { font-size: 13px; color: var(--text-sec); margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text); }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--bg); color: var(--text); }
    input:focus, select:focus { outline: none; border-color: var(--blue-400); }
    input::placeholder { color: var(--text-ter); }
    .note { font-size: 12px; color: var(--text-ter); margin-top: 4px; }
    .save-btn { width: 100%; padding: 12px 16px; background: var(--blue-600); color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 8px; }
    .save-btn:hover { background: var(--blue-400); }
    .status { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 13px; text-align: center; }
    .status.success { background: var(--green-50); color: var(--green-600); }
    .status.error { background: var(--coral-50); color: var(--coral-800); }
  </style>
</head>
<body>
  <h1>LLM 设置</h1>
  <p class="subtitle">配置 AI 文本清洗功能（可选）</p>

  <div class="form-group">
    <label for="provider">Provider</label>
    <select id="provider">
      <option value="anthropic">Anthropic</option>
      <option value="openai">OpenAI</option>
      <option value="custom">Custom</option>
    </select>
  </div>

  <div class="form-group">
    <label for="endpoint">Endpoint</label>
    <input type="text" id="endpoint" placeholder="https://api.anthropic.com">
    <p class="note">Anthropic 默认: https://api.anthropic.com<br>OpenAI 默认: https://api.openai.com/v1</p>
  </div>

  <div class="form-group">
    <label for="model">Model</label>
    <input type="text" id="model" placeholder="claude-haiku-20250709">
    <p class="note">推荐: claude-haiku-20250709 / gpt-4o-mini</p>
  </div>

  <div class="form-group">
    <label for="apiKey">API Key</label>
    <input type="password" id="apiKey" placeholder="sk-ant-...">
    <p class="note">密钥将使用设备指纹加密存储，不会传输到任何第三方</p>
  </div>

  <button class="save-btn" id="saveBtn">保存设置</button>
  <div class="status" id="status" style="display:none;"></div>

  <script src="settings.js" type="module"></script>
</body>
</html>
