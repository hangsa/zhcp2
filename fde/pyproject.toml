[project]
name = "fde"
version = "0.1.0"
description = "Font De-Obfuscation Engine — high-precision Chinese text recovery from obfuscated web fonts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "fonttools>=4.50",
    "mitmproxy>=10.0",
    "Pillow>=10.0",
    "pycairo>=1.26",
    "faiss-cpu>=1.7",
    "torch>=2.0",
    "torchvision>=0.15",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "redis>=5.0",
    "playwright>=1.40",
    "paddleocr>=2.7",
    "prometheus-client>=0.19",
    "numpy>=1.26",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "locust>=2.20",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
